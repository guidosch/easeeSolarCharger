name: Deploy

# Deployment happens from `main` and from nowhere else: what is in the repository is what runs
# (constitution, Technology & Deployment Constraints). Authentication is via Workload Identity
# Federation, so no service-account key exists in the repository to leak.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT: solarpowerconsumptionoptimizer
  REGION: europe-west6

jobs:
  verify:
    # Deploying past a red pipeline would make the merge gate decorative.
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: easee-deployer@solarpowerconsumptionoptimizer.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push both images
        run: |
          REGISTRY="$REGION-docker.pkg.dev/$PROJECT/services"
          for SERVICE in api optimizer; do
            IMAGE="$REGISTRY/easee-$SERVICE:${{ github.sha }}"
            docker build -f "services/$SERVICE/Dockerfile" -t "$IMAGE" .
            docker tag "$IMAGE" "$REGISTRY/easee-$SERVICE:latest"
            docker push "$IMAGE"
            docker push "$REGISTRY/easee-$SERVICE:latest"
            # Record what we actually pushed. Cloud Run resolves the tag to a digest when it
            # creates the revision, so the digest -- not the tag -- is what the deployed revision
            # can later be compared against.
            DIGEST="$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}' | cut -d@ -f2)"
            if [ -z "$DIGEST" ]; then
              echo "easee-$SERVICE: could not read the digest of the image just pushed" >&2
              exit 1
            fi
            echo "DIGEST_$SERVICE=$DIGEST" >> "$GITHUB_ENV"
          done

      - name: Deploy both services
        run: |
          REGISTRY="$REGION-docker.pkg.dev/$PROJECT/services"
          for SERVICE in api optimizer; do
            # Pin the revision to this commit's immutable tag. Replacing a spec that still says
            # `:latest` is a no-op -- Cloud Run resolves the tag to a digest once, at revision
            # creation, so an unchanged spec creates no revision and the old image keeps serving.
            sed "s#$REGISTRY/easee-$SERVICE:latest#$REGISTRY/easee-$SERVICE:${{ github.sha }}#" \
              "infra/cloudrun/$SERVICE.service.yaml" > "/tmp/$SERVICE.service.yaml"
            gcloud run services replace "/tmp/$SERVICE.service.yaml" \
              --project="$PROJECT" --region="$REGION"
          done

      - name: Verify both services serve this commit
        run: |
          for SERVICE in api optimizer; do
            # Checking the service spec would be a tautology -- it only echoes back what `replace`
            # just sent. The question is whether a revision was actually created, so ask the
            # revision that is serving traffic what image it is running.
            REVISION="$(gcloud run services describe "easee-$SERVICE" \
              --project="$PROJECT" --region="$REGION" \
              --format='value(status.latestReadyRevisionName)')"
            if [ -z "$REVISION" ]; then
              echo "easee-$SERVICE: could not determine the serving revision" >&2
              exit 1
            fi

            IMAGE="$(gcloud run revisions describe "$REVISION" \
              --project="$PROJECT" --region="$REGION" \
              --format='value(spec.containers[0].image)')"
            if [ -z "$IMAGE" ]; then
              echo "easee-$SERVICE: could not read the image of revision $REVISION" >&2
              exit 1
            fi

            VAR="DIGEST_$SERVICE"
            EXPECTED="${!VAR}"
            if [ -z "$EXPECTED" ]; then
              echo "easee-$SERVICE: the build step recorded no digest to compare against" >&2
              exit 1
            fi

            # Cloud Run rewrites the tag we deploy into `repo@sha256:...`, so compare digests.
            # The tag form is still accepted in case a revision records it verbatim.
            case "$IMAGE" in
              *@*)   ACTUAL="${IMAGE##*@}" ;;
              *)     ACTUAL="" ;;
            esac

            if [ "$ACTUAL" = "$EXPECTED" ] || [ "$IMAGE" != "${IMAGE%:${{ github.sha }}}" ]; then
              echo "easee-$SERVICE: $REVISION serves ${{ github.sha }} ($IMAGE)"
            else
              echo "easee-$SERVICE: $REVISION serves $IMAGE," >&2
              echo "  expected digest $EXPECTED (built from ${{ github.sha }})." >&2
              echo "  No new revision was created for this commit." >&2
              exit 1
            fi
          done

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Approve builds
        run: pnpm approve-builds

      - run: pnpm build

      - name: Deploy the static bundles, rules and indexes
        run: |
          pnpm dlx firebase-tools@13 deploy \
            --only hosting,firestore:rules,firestore:indexes \
            --project "$PROJECT" \
            --non-interactive

      - name: Smoke test
        run: |
          API_URL="$(gcloud run services describe easee-api \
            --project="$PROJECT" --region="$REGION" --format='value(status.url)')"
          curl --fail --silent --show-error "$API_URL/api/health"
