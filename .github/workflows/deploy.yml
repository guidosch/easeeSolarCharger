name: Deploy

# Deployment happens from `main` and from nowhere else: what is in the repository is what runs
# (constitution, Technology & Deployment Constraints). Authentication is via Workload Identity
# Federation, so no service-account key exists in the repository to leak.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT: easee-solar-charger
  REGION: europe-west6

jobs:
  verify:
    # Deploying past a red pipeline would make the merge gate decorative.
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/github
          service_account: easee-deployer@easee-solar-charger.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - name: Build and push both images
        run: |
          REGISTRY="$REGION-docker.pkg.dev/$PROJECT/services"
          for SERVICE in api optimizer; do
            IMAGE="$REGISTRY/easee-$SERVICE:${{ github.sha }}"
            docker build -f "services/$SERVICE/Dockerfile" -t "$IMAGE" .
            docker tag "$IMAGE" "$REGISTRY/easee-$SERVICE:latest"
            docker push "$IMAGE"
            docker push "$REGISTRY/easee-$SERVICE:latest"
          done

      - name: Deploy both services
        run: |
          for SERVICE in api optimizer; do
            gcloud run services replace "infra/cloudrun/$SERVICE.service.yaml" \
              --project="$PROJECT" --region="$REGION"
          done

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Deploy the static bundles, rules and indexes
        run: |
          pnpm dlx firebase-tools@13 deploy \
            --only hosting,firestore:rules,firestore:indexes \
            --project "$PROJECT" \
            --non-interactive

      - name: Smoke test
        run: |
          API_URL="$(gcloud run services describe easee-api \
            --project="$PROJECT" --region="$REGION" --format='value(status.url)')"
          curl --fail --silent --show-error "$API_URL/api/health"
